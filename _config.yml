title: "Haozhuang Chi"
description: "Autonomous Driving AI • Multimodal LLMs • VLA & World Models"
url: "https://fisher75.github.io"
baseurl: "/haozhuangchi.github.io"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "contrast"

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
locale: "en-US"
encoding: "utf-8"

include:
  - _pages
  - zh

author:
  name: "Haozhuang Chi (迟浩壮)"
  avatar: "/assets/images/avatar.jpg"
  bio: "Autonomous Driving AI • Multimodal & World Models"
  location: "Singapore / Shanghai"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:chih0001@e.ntu.edu.sg"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/haozhuang-chi"
    - label: "CV"
      icon: "fas fa-file-pdf"
      url: "/haozhuangchi.github.io/assets/cv/Haozhuang_Chi_CV.pdf"
    - label: "Paper (IV 2025)"
      icon: "fas fa-book"
      url: "/haozhuangchi.github.io/assets/papers/VLM-DM_IV2025.pdf"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      nav: main
  - scope:
      path: "zh"
      type: pages
    values:
      layout: single
      author_profile: true
      nav: main_zh
      locale: "zh-CN"

reading_time: true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">PV-WM project card</title>
  <desc id="desc">A blue pedestrian and orange vehicle connected through a recurrent world-model relation graph.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="54" x2="1110" y2="746" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173f70"/>
      <stop offset="0.54" stop-color="#0d294b"/>
      <stop offset="1" stop-color="#07182c"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(316 372) rotate(28) scale(420 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dbce8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2dbce8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientTransform="translate(900 360) rotate(150) scale(360 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f47732" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f47732" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#79a9cf" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#blueGlow)"/>
  <rect width="1200" height="800" fill="url(#orangeGlow)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <g transform="translate(72 70)">
    <path d="M0 12h86" stroke="#78d4f1" stroke-linecap="round" stroke-width="10"/>
    <text x="0" y="82" fill="#fff" font-family="Trebuchet MS, sans-serif" font-size="68" font-weight="700" letter-spacing="1">PV-WM</text>
    <text x="0" y="126" fill="#b8d3e7" font-family="Trebuchet MS, sans-serif" font-size="25" letter-spacing="1">HETEROGENEOUS MICRO-MACRO WORLD MODEL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="276" width="1032" height="322" rx="42" fill="#102d50" fill-opacity=".84" stroke="#8ec9ea" stroke-opacity=".24" stroke-width="2"/>
  </g>

  <g opacity=".5" fill="none" stroke="#4c93e9" stroke-linecap="round" stroke-width="6">
    <path d="M154 497c38-89 77-163 133-199" stroke-dasharray="10 18"/>
    <path d="M176 523c51-49 101-74 153-78" stroke-dasharray="10 18"/>
  </g>

  <g transform="translate(279 337)" fill="none" stroke="#48c4ec" stroke-linecap="round" stroke-linejoin="round" stroke-width="17">
    <circle cx="0" cy="0" r="24" fill="#48c4ec" stroke="none"/>
    <path d="M0 34 0 119M0 64l-58 40M0 64l58 34M0 119l-46 79M0 119l60 74"/>
  </g>

  <path d="M392 438c104-73 205-77 315-18" fill="none" stroke="#876be8" stroke-linecap="round" stroke-width="17"/>
  <circle cx="397" cy="435" r="18" fill="#876be8"/>
  <circle cx="707" cy="421" r="18" fill="#876be8"/>
  <g fill="#a28df0">
    <circle cx="481" cy="394" r="8"/>
    <circle cx="551" cy="384" r="8"/>
    <circle cx="623" cy="390" r="8"/>
  </g>

  <g transform="translate(720 340)">
    <path d="M28 65 72 8h156l77 63 58 16v91H0V91c0-14 11-24 28-26Z" fill="#ef6728"/>
    <path d="M92 30h118l49 43H58Z" fill="#ffd8c4" opacity=".9"/>
    <path d="M178 30v43" stroke="#ef6728" stroke-width="7"/>
    <circle cx="79" cy="176" r="40" fill="#07182c" stroke="#f6f9fd" stroke-width="12"/>
    <circle cx="283" cy="176" r="40" fill="#07182c" stroke="#f6f9fd" stroke-width="12"/>
  </g>

  <g font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">
    <g transform="translate(114 652)">
      <rect width="300" height="56" rx="28" fill="#48c4ec" fill-opacity=".15" stroke="#48c4ec" stroke-opacity=".42"/>
      <circle cx="29" cy="28" r="8" fill="#48c4ec"/>
      <text x="51" y="36" fill="#dff7ff">Articulated pedestrians</text>
    </g>
    <g transform="translate(424 652)">
      <rect width="266" height="56" rx="28" fill="#876be8" fill-opacity=".15" stroke="#876be8" stroke-opacity=".44"/>
      <circle cx="29" cy="28" r="8" fill="#876be8"/>
      <text x="51" y="36" fill="#eeeaff">Recurrent relations</text>
    </g>
    <g transform="translate(730 652)">
      <rect width="260" height="56" rx="28" fill="#ef6728" fill-opacity=".15" stroke="#ef6728" stroke-opacity=".44"/>
      <circle cx="29" cy="28" r="8" fill="#ef6728"/>
      <text x="51" y="36" fill="#ffe9dd">Rigid vehicles</text>
    </g>
  </g>

  <text x="1084" y="743" fill="#8ba8bf" font-family="Trebuchet MS, sans-serif" font-size="20" text-anchor="end">STRUCTURED CO-ROLLOUT</text>
</svg>
